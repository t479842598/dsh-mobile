name: Android APK

# 上游 ci.yml 只覆盖 iOS（Simulator 构建 + 单测 + IPA Release），
# Android 侧没有任何流水线，release 页面上的 APK 由作者本地手工构建。
# 本工作流补上这一步：产出可直接安装的 APK 并上传为构件。
#
# 关于签名：androidApp/build.gradle.kts 的 release buildType 显式指定
# signingConfig = signingConfigs.getByName("debug")，且 isMinifyEnabled = false。
# 因此 assembleRelease 产出的是「debug 密钥签名、未混淆」的包，
# 与上游 release 资产同签名，可原地覆盖升级，无需额外 secrets。

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # androidApp 用 jvmToolchain(17)，这里直接给 17，避免 foojay 再去下载工具链
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Assemble APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate and describe APK
        run: |
          find androidApp/build/outputs/apk -name "*.apk" -type f -exec ls -l {} \;
          APK=$(find androidApp/build/outputs/apk -name "*.apk" -type f | head -1)
          test -n "$APK" || { echo "::error::未找到 APK"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-android-apk
          path: |
            androidApp/build/outputs/apk/**/*.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14
