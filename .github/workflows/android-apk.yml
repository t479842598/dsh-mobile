name: Android APK

# 上游 ci.yml 只覆盖 iOS（Simulator 构建 + 单测 + IPA Release），
# Android 侧没有任何流水线，release 页面上的 APK 由作者本地手工构建。
# 本工作流补上这一步：产出可直接安装的 APK 并上传为构件。
#
# 关于签名：androidApp/build.gradle.kts 的 release buildType 显式指定
# signingConfig = signingConfigs.getByName("debug")，且 isMinifyEnabled = false。
# 因此 assembleRelease 产出的是「debug 密钥签名、未混淆」的包，
# 与上游 release 资产同签名，可原地覆盖升级，无需额外 secrets。

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 本仓库在 f2fs 上开发，core.fileMode=false 会让新加入索引的 gradlew 丢失可执行位
      # （git 会记成 100644）。这里兜底，否则会以 exit 126 在无关步骤上失败。
      - name: 确保 gradlew 可执行
        run: chmod +x ./gradlew

      # androidApp 用 jvmToolchain(17)，直接给 17，避免 foojay 再下载工具链
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 刻意不用 android-actions/setup-android：它会执行 `sdkmanager --install tools`，
      # 在 ubuntu-latest 上因 "Warning: Failed to find package 'tools'" 直接退出 1，
      # 使整个 job 在第一步就失败。runner 镜像本身已自带 SDK 与 cmdline-tools，
      # 这里只补装本工程需要的 platform 36 与 build-tools。
      - name: Prepare Android SDK
        run: |
          test -d "$ANDROID_HOME" || { echo "::error::$ANDROID_HOME 不存在"; exit 1; }
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          test -n "$SDKM" || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "sdkmanager = $SDKM"
          echo "SDKM=$SDKM" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Assemble APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate and describe APK
        run: |
          find androidApp/build/outputs/apk -name "*.apk" -type f -exec ls -l {} \;
          APK=$(find androidApp/build/outputs/apk -name "*.apk" -type f | head -1)
          test -n "$APK" || { echo "::error::未找到 APK"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-android-apk
          path: |
            androidApp/build/outputs/apk/**/*.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 14
