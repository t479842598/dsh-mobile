name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet \
            build

      - name: Unit Tests
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            test \
            2>&1 | tee test-output.log

      - name: Test Summary
        if: always()
        run: grep -E "Test Suite.*passed|Test Suite.*failed|Executed.*tests|TEST SUCCEEDED|TEST FAILED" test-output.log || true

  release:
    name: Release IPA
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Archive
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ./build/DshMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ./build/DshMobile.xcarchive/Products/Applications/DshMobile.app Payload/
          zip -r DshMobile.ipa Payload
          rm -rf Payload

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: DshMobile.ipa
          generate_release_notes: true