name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    strategy:
      matrix:
        destination:
          - 'generic/platform=iOS Simulator'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (Simulator)
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet \
            build

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            test \
            2>&1 | tee test-output.log

      - name: Summarize test results
        if: always()
        run: grep -E "Test Suite.*passed|Test Suite.*failed|Executed.*tests|TEST SUCCEEDED|TEST FAILED" test-output.log || true

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (Unsigned Archive)
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ./build/DshMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R ./build/DshMobile.xcarchive/Products/Applications/DshMobile.app Payload/
          zip -r DshMobile.ipa Payload
          rm -rf Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DshMobile.ipa
          generate_release_notes: true